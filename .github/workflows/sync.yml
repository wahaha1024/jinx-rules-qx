name: Sync upstream and rebuild QX rules

on:
  schedule:
    - cron: "0 1 * * *" # 每天 UTC 1:00（北京时间 9:00）
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone upstream
        run: git clone --depth 1 https://github.com/VME98/jinx-rules.git upstream

      - name: Rebuild QX rules
        run: python3 build_qx.py upstream/rules jinx-adblock-qx.list

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jinx-adblock-qx.list
          if git diff --cached --quiet; then
            echo "No changes, skip"
          else
            git commit -m "chore: sync upstream $(date -u +%F)"
            git push
          fi
